<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveAlert - Panel de Avisos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="alert-container">
        <h1>SELECCIONAR TIPO DE AVISO</h1>
        
        <div class="grid-alerts">
            <div class="alert-card">
                <div class="alert-label">Animal Salvaje</div>
            </div>

            <div class="alert-card">
                <div class="alert-label">Corte de Vía</div>
            </div>

            <div class="alert-card">
                <div class="alert-label">Accidente</div>
            </div>

            <div class="alert-card">
                <div class="alert-label">Atasco / Retención</div>
            </div>
        </div>

        <div class="voice-indicator">
            Indique en voz alta su alerta.
        </div>

        <div id="log" style="text-align: center; margin-top: 15px; color: #ffd700; font-weight: bold; min-height: 1.2em;">
            Haz clic en cualquier lugar para activar el sistema
        </div>
    </div>
</body>
</html>
